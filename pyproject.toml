[project]
name = "cvt"
version = "0.1.0"
description = "UAV traffic analytics for motorbike-dominated Vietnamese traffic"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "pillow>=10",
  "imagehash>=4.3",
  "pycocotools>=2.0.8",
  "pyyaml>=6",
  "typer>=0.12",
  "scipy>=1.13",
]

[project.optional-dependencies]
ml = [
    "onnx>=1.17,<2",
    "tensorrt-cu12==10.16.1.11",
    "tensorrt-cu12-bindings==10.16.1.11",
    "tensorrt-cu12-libs==10.16.1.11",
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3.0",
]

[project.scripts]
cvt = "cvt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "trackeval==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvt"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
tensorrt-cu12 = [{ index = "nvidia" }]
tensorrt-cu12-libs = [{ index = "nvidia" }]
tensorrt-cu12-bindings = [{ index = "nvidia" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end CPU smoke test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "pathlib.Path"]
